<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌴 Suche mit paulausbkk dein Hotel und dein Flug weltweit</title>
<style>
:root{--d:#0c4a6e;--t:#0f172a;--b:#bae6fd;--v:#0284c7}
html,body{margin:0;padding:10px;
background:linear-gradient(180deg,#dbeafe 0%,#f0f9ff 100%);
height:100vh;min-height:100vh;font-family:sans-serif;
color:var(--t);box-sizing:border-box;display:flex;
flex-direction:column;overflow-x:hidden}
.hdr{display:flex;justify-content:space-between;align-items:center;
background:#0f2942;padding:10px 16px;border-radius:12px;
margin-bottom:10px;flex-wrap:wrap;gap:8px;flex-shrink:0;
box-shadow:0 4px 14px rgba(15,41,66,.18)}
.tit{font-weight:bold;color:#fff;font-size:1.12rem;margin:0}
.cp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{font-size:.78rem;padding:7px 12px;border-radius:6px;
font-weight:bold;color:#fff;text-transform:uppercase;
background:#0284c7;text-decoration:none;border:1px solid #38bdf8}
.seg.upg{background:#1e40af;border-color:#60a5fa}
.bento{display:grid;grid-template-columns:1fr 1fr;
grid-template-rows:auto 1fr;gap:12px;flex:1;min-height:0}
.box{background:#fff;border:1px solid #93c5fd;border-radius:12px;
padding:12px;box-shadow:0 4px 12px rgba(3,105,161,.08);
display:flex;flex-direction:column;height:100%;
box-sizing:border-box;min-height:0}
.box.wide{grid-column:span 2}
@media(max-width:740px){
html,body{height:auto}
.bento{grid-template-columns:1fr;grid-template-rows:auto}
.box.wide{grid-column:span 1}
}
.pic{position:relative;border-radius:10px;overflow:hidden;
min-height:155px;display:flex;align-items:flex-end;padding:16px;
background-color:#0f2942;background-image:url("Flügel.jpg");
background-position:center 22%;background-size:118%;
background-repeat:no-repeat}
.pic::before{content:"";position:absolute;inset:0;
background:linear-gradient(0deg,rgba(15,41,66,.75) 10%,
rgba(15,41,66,.08) 100%)}
.ptxt{position:relative;z-index:2;color:#fff}
.ptxt h2{margin:0 0 10px 0;font-size:1.35rem}
.cta{display:inline-block;background:#0284c7;color:#fff;
font-weight:bold;text-decoration:none;padding:9px 18px;
border-radius:8px;font-size:.9rem;border:1px solid #7dd3fc}
.cta:hover{background:#0369a1}
.ct{font-weight:bold;font-size:1rem;color:var(--d);
border-bottom:2px solid #e0f2fe;padding-bottom:5px;margin-bottom:8px;
flex-shrink:0}
.ct-sub{font-size:.52em;font-weight:normal;color:#475569;
margin-left:5px}
.gal-grid{display:grid;grid-template-columns:1.25fr 1fr;
grid-template-rows:repeat(3,1fr);gap:8px;flex:1;min-height:0}
.gitem{position:relative;border-radius:8px;overflow:hidden;
border:1px solid #bae6fd;min-height:0;background:#e0f2fe;
display:block;text-decoration:none;cursor:zoom-in}
.gitem.tall{grid-row:span 3}
.gitem img{width:100%;height:100%;object-fit:cover;
object-position:center;display:block;transition:.25s}
.gitem.tall img{object-position:center 15%}
.gitem:hover img{transform:scale(1.04);filter:brightness(1.06)}
.gnum{position:absolute;top:5px;left:5px;z-index:2;
background:rgba(15,41,66,.85);color:#fff;font-weight:bold;
font-size:.75rem;padding:2px 7px;border-radius:5px;
border:1px solid #7dd3fc}
@keyframes pulseHint{
0%,100%{border-color:#7f1d1d;box-shadow:0 0 0 rgba(185,28,28,0)}
50%{border-color:#dc2626;box-shadow:0 0 14px rgba(185,28,28,.7)}
}
.user-alert{flex:1;display:flex;flex-direction:column;
border:3px solid #991b1b;border-left:7px solid #991b1b;
border-radius:10px;padding:9px 12px;margin-bottom:8px;
background:#fff;animation:pulseHint 2.2s infinite ease-in-out}
.user-ct{font-weight:bold;font-size:.98rem;color:var(--d);
border-bottom:1px solid #e0f2fe;padding-bottom:4px;
margin-bottom:6px;flex-shrink:0}
.note-space{flex:1;min-height:52px;color:#334155;font-size:.84rem;
line-height:1.4}
.bn{background:#0f2942;border:2px solid #0284c7;
border-left:6px solid #0284c7;border-radius:8px;padding:7px 11px;
color:#fff;font-weight:bold;font-size:.78rem;line-height:1.35;
margin-bottom:8px;flex-shrink:0}
.bottom-block{margin-top:auto;flex-shrink:0}
.sub-ct{font-weight:bold;font-size:.9rem;color:var(--d);
margin:0 0 5px 0}
details{background:#f0f9ff;border:1px solid #bae6fd;
border-radius:8px;padding:6px 10px;margin-bottom:5px}
details:last-child{margin-bottom:0}
summary{font-weight:bold;cursor:pointer;color:var(--d);
font-size:.84rem}
details p{margin:4px 0 0 0;font-size:.8rem;line-height:1.35;
color:#1e293b}
.lb{position:fixed;inset:0;background:rgba(15,23,42,.92);
display:none;align-items:center;justify-content:center;
z-index:999;padding:20px}
.lb:target{display:flex}
.lb img{max-width:94vw;max-height:88vh;border-radius:10px;
border:2px solid #7dd3fc;box-shadow:0 10px 30px rgba(0,0,0,.6);
object-fit:contain}
.lb-bg{position:absolute;inset:0;cursor:zoom-out}
.lb-x{position:fixed;top:16px;right:20px;z-index:1001;
background:#0284c7;color:#fff;text-decoration:none;
font-weight:bold;padding:8px 14px;border-radius:8px;
border:1px solid #7dd3fc;font-size:.9rem}
</style>
</head>
