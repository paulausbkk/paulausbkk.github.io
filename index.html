<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌴 Suche mit paulausbkk dein Hotel und dein Flug weltweit</title>
<style>
:root{--d:#0c4a6e;--t:#0f172a;--b:#bae6fd;--v:#0284c7}
html,body{margin:0;padding:8px;
background:linear-gradient(180deg,#dbeafe 0%,#f0f9ff 100%);
height:100vh;min-height:100vh;font-family:sans-serif;
color:var(--t);box-sizing:border-box;display:flex;
flex-direction:column;overflow-x:hidden}
.state-inp{position:fixed;opacity:0;pointer-events:none}
#enter-chk:checked ~ .welcome{display:none}
.en-txt{display:none}
#lang-en:checked ~ .hdr .de-txt,
#lang-en:checked ~ .bento .de-txt,
#lang-en:checked ~ .lb .de-txt{display:none}
#lang-en:checked ~ .hdr .en-txt,
#lang-en:checked ~ .bento .en-txt,
#lang-en:checked ~ .lb .en-txt{display:inline}
#lang-de:checked ~ .hdr .flg-de,
#lang-en:checked ~ .hdr .flg-en{background:#0284c7;border-color:#7dd3fc;
box-shadow:0 0 8px rgba(125,211,252,.5)}
.welcome{position:fixed;inset:0;background:rgba(15,41,66,.88);
display:flex;align-items:center;justify-content:center;
z-index:2000;padding:20px;backdrop-filter:blur(4px)}
.w-card{background:#fff;border:2px solid #7dd3fc;border-radius:16px;
padding:26px 30px;text-align:center;max-width:400px;
box-shadow:0 12px 32px rgba(0,0,0,.45)}
.w-card h2{margin:0 0 10px 0;color:#0f2942;font-size:1.35rem}
.w-card p{margin:0 0 18px 0;color:#334155;font-size:.92rem;
line-height:1.45}
.w-btn{display:inline-block;background:#0284c7;color:#fff;border:none;
border-radius:10px;padding:12px 24px;font-size:1rem;font-weight:bold;
cursor:pointer;box-shadow:0 4px 12px rgba(2,132,199,.35);transition:.2s}
.w-btn:hover{background:#0369a1;transform:translateY(-1px)}
.hdr{display:flex;flex-direction:column;gap:8px;
background:linear-gradient(180deg,#0f2942 0%,#0c2238 100%);
padding:9px 16px;border-radius:12px;margin-bottom:8px;
flex-shrink:0;border:1px solid #1e3a8a;
box-shadow:0 4px 14px rgba(15,41,66,.22)}
.tit{font-weight:800;color:#f0f9ff;margin:0;width:100%;
display:flex;justify-content:center;align-items:center;
gap:28px;font-size:clamp(1.05rem,2.15vw,1.62rem);
line-height:1.15;letter-spacing:.04em;padding-bottom:6px;
border-bottom:1px solid rgba(125,211,252,.22);
text-shadow:0 2px 10px rgba(56,189,248,.35)}
.tit-brand{color:#38bdf8;text-shadow:0 0 12px rgba(56,189,248,.5)}
@media(max-width:860px){
.tit{flex-wrap:wrap;justify-content:center;text-align:center;
gap:8px;letter-spacing:.01em}
}
.hdr-bot{display:flex;align-items:center;justify-content:center;
gap:8px;flex-wrap:wrap;width:100%}
.hdr-tools{display:flex;align-items:center;gap:5px;flex-shrink:0}
.mbtn{background:#1e3a8a;color:#fff;border:1px solid #60a5fa;
border-radius:6px;padding:4px 8px;font-size:.72rem;
font-weight:bold;cursor:pointer;transition:.2s;white-space:nowrap}
.mbtn:hover,.mbtn.on{background:#0284c7;border-color:#7dd3fc;
box-shadow:0 0 8px rgba(125,211,252,.5)}
.mbtn .m-off{display:inline}
.mbtn .m-on{display:none}
.mbtn.on .m-off{display:none}
.mbtn.on .m-on{display:inline}
.langs{display:flex;gap:4px;align-items:center}
.flg{background:#1e3a8a;color:#fff;border:1px solid #60a5fa;
border-radius:6px;padding:4px 8px;font-size:.75rem;
font-weight:bold;cursor:pointer;transition:.2s;white-space:nowrap;
user-select:none}
.flg:hover{background:#0284c7;border-color:#7dd3fc}
.cp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
justify-content:center}
.seg{font-size:.74rem;padding:5px 10px;border-radius:6px;
font-weight:bold;color:#fff;text-transform:uppercase;
background:#0284c7;text-decoration:none;border:1px solid #38bdf8;
white-space:nowrap}
.seg:hover{background:#0369a1}
.locked{opacity:.55;cursor:not-allowed}
body.unlocked .lock-ico{display:none}
.bento{display:grid;grid-template-columns:1fr 1fr;
grid-template-rows:auto 1fr;gap:10px;flex:1;min-height:0}
.box{background:#fff;border:1px solid #93c5fd;border-radius:12px;
padding:10px;box-shadow:0 4px 12px rgba(3,105,161,.08);
display:flex;flex-direction:column;height:100%;
box-sizing:border-box;min-height:0}
.box.wide{grid-column:span 2}
@media(max-width:740px){
html,body{height:auto}
.bento{grid-template-columns:1fr;grid-template-rows:auto}
.box.wide{grid-column:span 1}
}
@keyframes wingDayNight{
0%,100%{filter:brightness(1.14) contrast(1.04) saturate(1.12)}
50%{filter:brightness(0.58) contrast(1.16) saturate(1.25) hue-rotate(-12deg)}
}
@keyframes lisSunCycle{
0%,100%{filter:brightness(1.12) saturate(1.15) sepia(0.05) hue-rotate(0deg)}
22%{filter:brightness(1.02) saturate(1.55) sepia(0.35) hue-rotate(-12deg)}
40%{filter:brightness(0.80) saturate(2.15) sepia(0.58) hue-rotate(-24deg)}
55%{filter:brightness(0.42) saturate(1.45) sepia(0.30) hue-rotate(195deg)}
72%{filter:brightness(0.84) saturate(1.95) sepia(0.50) hue-rotate(-18deg)}
88%{filter:brightness(1.16) saturate(1.40) sepia(0.22) hue-rotate(-4deg)}
}
@keyframes sunTint{
0%,100%{opacity:0}
25%{opacity:.75;background:linear-gradient(180deg,rgba(253,224,71,.22) 0%,rgba(249,115,22,.38) 65%,rgba(154,52,18,.48) 100%)}
42%{opacity:1;background:linear-gradient(180deg,rgba(251,146,60,.28) 0%,rgba(220,38,38,.52) 60%,rgba(124,45,18,.70) 100%)}
56%{opacity:.95;background:linear-gradient(180deg,rgba(15,23,42,.58) 0%,rgba(30,58,138,.48) 65%,rgba(15,23,42,.75) 100%)}
74%{opacity:.90;background:linear-gradient(180deg,rgba(254,240,138,.28) 0%,rgba(249,115,22,.46) 60%,rgba(180,83,9,.52) 100%)}
90%{opacity:.35;background:linear-gradient(180deg,rgba(254,249,195,.20) 0%,rgba(251,146,60,.20) 100%)}
}
.pic{position:relative;border-radius:10px;overflow:hidden;
min-height:135px;display:flex;align-items:stretch;padding:12px 14px;
background-color:#0f2942;background-image:url("Flügel.jpg");
background-position:center 22%;background-size:118%;
background-repeat:no-repeat;
animation:wingDayNight 14s infinite ease-in-out}
.pic::before{content:"";position:absolute;inset:0;
background:linear-gradient(180deg,rgba(15,41,66,.72) 0%,
rgba(15,41,66,.18) 50%,rgba(15,41,66,.75) 100%)}
.ptxt{position:relative;z-index:2;color:#fff;width:100%;
display:flex;flex-direction:column;justify-content:space-between;
align-items:flex-start;gap:4px}
.ptxt h2{margin:0;font-size:clamp(1.2rem,2.3vw,1.8rem);
font-weight:800;letter-spacing:.05em;line-height:1.15;
text-shadow:0 2px 8px rgba(0,0,0,.55)}
.fly-wide{display:inline-block;transform:scaleX(1.12);
transform-origin:left center}
.fly-arrow{font-size:1.55rem;line-height:1;
margin:2px 0 2px 175px;
filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
@media(max-width:740px){
.fly-wide{transform:none}
.fly-arrow{margin-left:135px}
}
.cta{display:inline-block;background:#0284c7;color:#fff;
font-weight:bold;text-decoration:none;padding:8px 16px;
border-radius:8px;font-size:.88rem;border:1px solid #7dd3fc}
.cta:hover{background:#0369a1}
.ct{font-weight:bold;font-size:.96rem;color:var(--d);
border-bottom:2px solid #e0f2fe;padding-bottom:4px;margin-bottom:6px;
flex-shrink:0}
.ct-sub{font-size:.52em;font-weight:normal;color:#475569;
margin-left:5px}
.gal-grid{display:grid;grid-template-columns:1.25fr 1fr;
grid-template-rows:repeat(3,1fr);gap:7px;flex:1;min-height:0}
.gitem{position:relative;border-radius:8px;overflow:hidden;
border:1px solid #bae6fd;min-height:0;background:#e0f2fe;
display:block;text-decoration:none;cursor:zoom-in}
.gitem.tall{grid-row:span 3}
.gitem img{width:100%;height:100%;object-fit:cover;
object-position:center;display:block;transition:.25s}
.gitem.tall img{object-position:center 15%;
animation:lisSunCycle 18s infinite ease-in-out}
.sun-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;
mix-blend-mode:multiply;animation:sunTint 18s infinite ease-in-out}
.gitem:hover img{transform:scale(1.04)}
.gnum{position:absolute;top:5px;left:5px;z-index:2;
background:rgba(15,41,66,.85);color:#fff;font-weight:bold;
font-size:.75rem;padding:2px 7px;border-radius:5px;
border:1px solid #7dd3fc}
@keyframes pulseHint{
0%,100%{border-color:#7f1d1d;box-shadow:0 0 0 rgba(185,28,28,0)}
50%{border-color:#dc2626;box-shadow:0 0 14px rgba(185,28,28,.7)}
}
.user-alert{flex:1;display:flex;flex-direction:column;
border:3px solid #991b1b;border-left:7px solid #991b1b;
border-radius:10px;padding:8px 11px;margin-bottom:6px;
background:#f0f9ff;animation:pulseHint 2.2s infinite ease-in-out}
.user-ct{font-weight:bold;font-size:.94rem;color:var(--d);
border-bottom:1px solid #bae6fd;padding-bottom:3px;
margin-bottom:5px;flex-shrink:0}
.note-space{flex:1;min-height:36px;color:#0f172a;font-size:.83rem;
font-weight:bold;line-height:1.35}
.pw-row{display:flex;justify-content:flex-end;align-items:center;
gap:6px;margin-top:5px;flex-shrink:0;flex-wrap:wrap}
.pw-msg{font-size:.74rem;font-weight:bold;color:#991b1b}
.pw-inp{height:28px;padding:0 8px;border:1px solid #0284c7;
border-radius:6px;font-size:.8rem;background:#fff;width:130px}
.pw-btn{height:28px;padding:0 10px;background:#0284c7;color:#fff;
border:none;border-radius:6px;font-weight:bold;font-size:.76rem;
cursor:pointer}
.pw-btn:hover{background:#0369a1}
.bn{background:#0f2942;border:2px solid #0284c7;
border-left:6px solid #0284c7;border-radius:8px;padding:6px 10px;
color:#fff;font-weight:bold;font-size:.75rem;line-height:1.3;
margin-bottom:6px;flex-shrink:0}
.bottom-block{margin-top:auto;flex-shrink:0}
.sub-ct{font-weight:bold;font-size:.86rem;color:var(--d);
margin:0 0 4px 0}
details{background:#f0f9ff;border:1px solid #bae6fd;
border-radius:8px;padding:5px 9px;margin-bottom:4px}
details:last-child{margin-bottom:0}
summary{font-weight:bold;cursor:pointer;color:var(--d);
font-size:.8rem}
details p{margin:3px 0 0 0;font-size:.77rem;line-height:1.3;
color:#1e293b}
.lb{position:fixed;inset:0;background:rgba(15,23,42,.92);
display:none;align-items:center;justify-content:center;
z-index:999;padding:20px}
.lb:target{display:flex}
.lb img{max-width:94vw;max-height:88vh;border-radius:10px;
border:2px solid #7dd3fc;box-shadow:0 10px 30px rgba(0,0,0,.6);
object-fit:contain}
