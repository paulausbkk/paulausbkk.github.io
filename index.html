/* Natürliche Licht- & Sonnenuntergangs-Simulation */
@keyframes wingShift{
  0%,100%{filter:brightness(1.02) saturate(1.04) hue-rotate(0deg)}
  35%{filter:brightness(1.07) saturate(1.24) sepia(.14) hue-rotate(-8deg)}
  70%{filter:brightness(.97) saturate(1.18) hue-rotate(10deg)}
}
@keyframes wingGlow{
  0%,100%{opacity:.12}
  40%{opacity:.34}
  75%{opacity:.22}
}
@keyframes sunsetPhoto{
  0%,100%{filter:brightness(1.03) saturate(1.06) contrast(1.02) sepia(.04)}
  32%{filter:brightness(1.02) saturate(1.28) contrast(1.05) sepia(.22) hue-rotate(-10deg)}
  62%{filter:brightness(.92) saturate(1.38) contrast(1.09) sepia(.34) hue-rotate(-18deg)}
  82%{filter:brightness(.86) saturate(1.22) contrast(1.07) sepia(.24) hue-rotate(-8deg)}
}
@keyframes sunsetWarmth{
  0%,100%{opacity:0}
  35%{opacity:.22}
  62%{opacity:.38}
  82%{opacity:.26}
}

<script>
const PASS="paul2026";
let ok=false;

function syncBgm(){
  const a=document.getElementById("bgm");
  const b=document.getElementById("mbtn");
  if(a&&b)b.classList.toggle("on",!a.paused);
}

function startBgm(){
  const a=document.getElementById("bgm");
  if(a){
    a.volume=0.45;
    a.play().then(syncBgm).catch(syncBgm);
  }
}

function toggleBgm(){
  const a=document.getElementById("bgm");
  if(!a)return;
  if(a.paused){
    startBgm();
  }else{
    a.pause();
    syncBgm();
  }
}

function isEn(){
  const r=document.getElementById("lang-en");
  return r&&r.checked;
}

function unlock(){
  ok=true;
  document.body.classList.add("unlocked");
  ["b1","b2","b3","b4"].forEach(function(id){
    document.getElementById(id).classList.remove("locked");
  });
